name: Fix Hardcoded Paths

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  fix-paths:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Path Fixer Script
        id: fixer
        run: |
          # Execute the script located in tools/ folder
          python tools/fix_paths.py
          
          # Check if git sees any changes
          if [[ $(git status --porcelain) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Changes
        if: steps.fixer.outputs.changes_detected == 'true'
        run: |
          git config --global user.name 'Pahatid Bot'
          git config --global user.email 'bot@pahatidsystem.com'
          
          git add .
          git commit -m "chore(auto-fix): Corrected hardcoded paths to relative URLs"
          git push origin HEAD:${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
