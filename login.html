<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Login / Register | Pahatid System</title>
    <meta name="description" content="Securely access your Pahatid account as a Commuter, Driver, or Administrator.">
    
    <!-- CSS Libraries (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .auth-card {
            max-width: 480px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .role-btn {
            flex: 1;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .role-btn.active {
            background-color: #0d6efd !important;
            color: white !important;
            border-color: #0d6efd !important;
        }
        .hidden { display: none !important; }
        
        /* DEBUG BOX STYLE - Hidden by default unless ?debug=true */
        #debugBox {
            background: #212529;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            white-space: pre-wrap;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div class="container px-4 py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Back Link -->
                <div class="mb-3 text-start">
                    <a href="index.html" class="text-decoration-none text-muted small">
                        <i class="fas fa-arrow-left me-1"></i> Back to Home
                    </a>
                </div>

                <!-- Main Card -->
                <div class="card auth-card border-0">
                    <div class="auth-header">
                        <h2 class="fw-bold mb-0"><i class="fas fa-motorcycle me-2"></i>Pahatid</h2>
                        <p class="mb-0 opacity-75 small mt-2">Access Your Transport Hub</p>
                    </div>
                    
                    <div class="card-body p-4">
                        
                        <!-- Tab Navigation -->
                        <ul class="nav nav-pills nav-fill mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">Login</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">Register</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="authTabContent">
                            
                            <!-- LOGIN FORM -->
                            <div class="tab-pane fade show active" id="login-pane" role="tabpanel" aria-labelledby="login-tab">
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label for="loginEmail" class="form-label fw-bold">Email Address</label>
                                        <input type="email" class="form-control" id="loginEmail" required placeholder="name@example.com">
                                    </div>
                                    <div class="mb-3">
                                        <label for="loginPassword" class="form-label fw-bold">Password</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••">
                                            <button class="btn btn-outline-secondary" type="button" onclick="togglePass('loginPassword', this)">
                                                <i class="fas fa-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary fw-bold py-2" id="btnLogin">Sign In</button>
                                    </div>
                                    <div class="text-center mt-3">
                                        <a href="#" class="text-muted small text-decoration-none">Forgot Password?</a>
                                    </div>
                                </form>
                            </div>

                            <!-- REGISTER FORM -->
                            <div class="tab-pane fade" id="register-pane" role="tabpanel" aria-labelledby="register-tab">
                                <form id="registerForm">
                                    <div class="mb-3">
                                        <label class="form-label d-block fw-bold">I am registering as:</label>
                                        <div class="role-selector">
                                            <button type="button" class="btn btn-outline-secondary role-btn active" data-role="commuter">
                                                <i class="fas fa-user-friends d-block mb-1"></i> Commuter
                                            </button>
                                            <button type="button" class="btn btn-outline-secondary role-btn" data-role="driver">
                                                <i class="fas fa-motorcycle d-block mb-1"></i> Driver
                                            </button>
                                            <!-- NOTE: Admin role removed from public selection for security -->
                                        </div>
                                        <input type="hidden" id="regRole" value="commuter">
                                    </div>

                                    <div class="mb-3">
                                        <label for="regFullName" class="form-label fw-bold">Full Name</label>
                                        <input type="text" class="form-control" id="regFullName" required placeholder="Juan Dela Cruz">
                                    </div>
                                    <div class="mb-3">
                                        <label for="regPhone" class="form-label fw-bold">Mobile Number</label>
                                        <input type="tel" class="form-control" id="regPhone" required placeholder="+63 9XX XXX XXXX">
                                    </div>
                                    <div class="mb-3">
                                        <label for="regEmail" class="form-label fw-bold">Email Address</label>
                                        <input type="email" class="form-control" id="regEmail" required placeholder="name@example.com">
                                    </div>
                                    <div class="row g-3 mb-3">
                                        <div class="col-6">
                                            <label for="regPassword" class="form-label fw-bold">Password</label>
                                            <input type="password" class="form-control" id="regPassword" required minlength="8" placeholder="Min 8 chars">
                                        </div>
                                        <div class="col-6">
                                            <label for="regConfirmPassword" class="form-label fw-bold">Confirm</label>
                                            <input type="password" class="form-control" id="regConfirmPassword" required placeholder="Repeat password">
                                        </div>
                                    </div>
                                    
                                    <!-- Extra Fields for Drivers -->
                                    <div id="driverFields" class="hidden bg-light p-3 rounded mb-3 border">
                                        <div class="alert alert-info small py-2 mb-3 border-0">
                                            <i class="fas fa-info-circle me-1"></i> Driver accounts require Admin approval. Please provide valid details.
                                        </div>
                                        <div class="mb-3">
                                            <label for="regLicense" class="form-label small fw-bold">Driver's License No.</label>
                                            <input type="text" class="form-control form-control-sm" id="regLicense" placeholder="e.g., ABC-123456">
                                        </div>
                                        <div class="mb-0">
                                            <label for="regPlate" class="form-label small fw-bold">Vehicle Plate Number</label>
                                            <input type="text" class="form-control form-control-sm" id="regPlate" placeholder="e.g., XYZ 1234">
                                        </div>
                                    </div>

                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-success fw-bold py-2" id="btnRegister">Create Account</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Error/Success Message Container -->
                <div id="authMessage" class="mt-3 text-center"></div>

                <!-- DEBUG OUTPUT BOX (Hidden unless ?debug=true) -->
                <div id="debugBox" class="hidden">
                    <strong>SYSTEM DEBUG LOG:</strong><br>
                    <span id="debugContent"></span>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        import { supabase } from './assets/js/config.js';

        // --- CONFIGURATION ---
        const IS_DEBUG = new URLSearchParams(window.location.search).get('debug') === 'true';
        
        // --- DEBUGGING HELPER ---
        function logDebug(message, data = null) {
            if (!IS_DEBUG) return; // Skip logging if not in debug mode
            
            const box = document.getElementById('debugBox');
            const content = document.getElementById('debugContent');
            
            box.classList.remove('hidden');
            
            let timestamp = new Date().toLocaleTimeString();
            let logEntry = `[${timestamp}] ${message}\n`;
            
            if (data) {
                try {
                    logEntry += JSON.stringify(data, null, 2) + "\n";
                } catch (e) {
                    logEntry += String(data) + "\n";
                }
            }
            
            content.textContent += logEntry;
            box.scrollTop = box.scrollHeight;
            console.log(logEntry);
        }

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const authMessage = document.getElementById('authMessage');
        const roleButtons = document.querySelectorAll('.role-btn');
        const regRoleInput = document.getElementById('regRole');
        const driverFields = document.getElementById('driverFields');

        // Helper: Toggle Password Visibility
        window.togglePass = function(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        };

        // --- UI LOGIC ---
        roleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                roleButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const selectedRole = btn.getAttribute('data-role');
                regRoleInput.value = selectedRole;

                if (selectedRole === 'driver') {
                    driverFields.classList.remove('hidden');
                    // Make license/plate required visually (logic handled in submit)
                    document.getElementById('regLicense').setAttribute('required', 'true');
                    document.getElementById('regPlate').setAttribute('required', 'true');
                } else {
                    driverFields.classList.add('hidden');
                    document.getElementById('regLicense').removeAttribute('required');
                    document.getElementById('regPlate').removeAttribute('required');
                }
            });
        });

        function showMessage(msg, type = 'danger') {
            const icons = { danger: 'times-circle', success: 'check-circle', info: 'info-circle' };
            authMessage.innerHTML = `<div class="alert alert-${type} py-2 px-3 small shadow-sm">
                <i class="fas fa-${icons[type]} me-2"></i>${msg}
            </div>`;
            setTimeout(() => { authMessage.innerHTML = ''; }, 5000);
        }

        // --- AUTHENTICATION LOGIC ---

        // 1. LOGIN HANDLER
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Signing in...';
            
            logDebug("--- STARTING LOGIN ATTEMPT ---");
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                logDebug(`Attempting signInWithPassword for: ${email}`);
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                logDebug("✅ SIGN IN SUCCESSFUL", { userId: data.user.id });
                showMessage('Login successful! Redirecting...', 'success');
                
                // STEP 2: FETCH PROFILE
                logDebug("Fetching profile from 'profiles' table...");
                
                const { data: profile, error: profileErr } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .single();

                if (profileErr) {
                    logDebug("❌ PROFILE QUERY ERROR", profileErr);
                    throw new Error(`Database Error: ${profileErr.message}`);
                }

                if (!profile) {
                    throw new Error("Profile record does not exist.");
                }

                logDebug("✅ PROFILE FOUND", { role: profile.role, status: profile.status });

                // STEP 3: VALIDATE STATUS & REDIRECT
                if (profile.status !== 'active') {
                    await supabase.auth.signOut();
                    throw new Error(`Account status is '${profile.status}'. Contact Admin.`);
                }

                routeUser(profile.role);

            } catch (err) {
                logDebug(`💥 FINAL ERROR CAUGHT: ${err.message}`);
                showMessage(err.message || 'Invalid credentials.', 'danger');
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        });

        // 2. REGISTER HANDLER
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnRegister');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Creating Account...';

            logDebug("--- STARTING REGISTRATION ---");

            const fullName = document.getElementById('regFullName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const role = regRoleInput.value;

            // Client-side validation
            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "danger");
                btn.disabled = false;
                btn.innerText = originalText;
                return;
            }

            try {
                logDebug(`Signing up user: ${email} with role: ${role}`);
                
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: fullName,
                            phone_number: phone,
                            role: role
                        }
                    }
                });

                if (error) throw error;

                logDebug("✅ SIGN UP API CALL SUCCESSFUL", { userId: data.user?.id });
                
                if (data.session) {
                    // Auto-login enabled scenario
                    showMessage('Registration successful! Verifying profile...', 'success');
                    
                    // Wait briefly for DB trigger to fire
                    setTimeout(async () => {
                       const { data: checkProfile, error: profErr } = await supabase.from('profiles').select('*').eq('id', data.user.id).single();
                       
                       if(profErr || !checkProfile) {
                           logDebug("⚠️ Trigger FAILED or delayed. Profile missing.", { expectedId: data.user.id });
                           showMessage("Registered, but profile creation failed. Refresh page or contact admin.", "warning");
                       } else {
                           logDebug("✅ Trigger worked! Profile exists.", checkProfile);
                           if(checkProfile.status === 'pending_approval') {
                               showMessage("Account created! Waiting for Admin approval.", "info");
                               setTimeout(() => window.location.reload(), 2000);
                           } else {
                               routeUser(checkProfile.role);
                           }
                       }
                    }, 2000);

                } else {
                    // Email confirmation required scenario
                    logDebug("ℹ️ Email confirmation required mode.");
                    showMessage('Check your email to confirm your account.', 'info');
                }

            } catch (err) {
                logDebug(`💥 REGISTRATION ERROR: ${err.message}`);
                showMessage(err.message || 'Registration failed.', 'danger');
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        });

        // --- ROUTING HELPER ---
        function routeUser(role) {
            logDebug(`🚀 Redirecting to dashboard for role: ${role}`);
            switch(role) {
                case 'admin':
                case 'dispatcher':
                    window.location.href = '/admin/dashboard.html';
                    break;
                case 'driver':
                    window.location.href = '/driver/dashboard.html';
                    break;
                case 'commuter':
                    window.location.href = '/commuter/dashboard.html';
                    break;
                default:
                    window.location.href = '/';
            }
        }
    </script>
</body>
</html>
