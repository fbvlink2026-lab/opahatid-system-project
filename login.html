<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary Meta Tags -->
    <title>Login / Register | Pahatid System</title>
    <meta name="description" content="Securely access your Pahatid account as a Commuter, Driver, or Administrator.">
    
    <!-- CSS Libraries (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .auth-card {
            max-width: 450px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .role-btn {
            flex: 1;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .role-btn.active {
            background-color: #0d6efd !important;
            color: white !important;
            border-color: #0d6efd !important;
        }
        .hidden { display: none !important; }
        
        /* DEBUG BOX STYLE */
        #debugBox {
            background: #212529;
            color: #00ff00;
            font-family: monospace;
            font-size: 0.8rem;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="container px-4 py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Back Link -->
                <div class="mb-3 text-start">
                    <a href="index.html" class="text-decoration-none text-muted small">
                        <i class="fas fa-arrow-left me-1"></i> Back to Home
                    </a>
                </div>

                <!-- Main Card -->
                <div class="card auth-card border-0">
                    <div class="auth-header">
                        <h2 class="fw-bold mb-0"><i class="fas fa-motorcycle me-2"></i>Pahatid</h2>
                        <p class="mb-0 opacity-75 small mt-2">Access Your Transport Hub</p>
                    </div>
                    
                    <div class="card-body p-4">
                        
                        <!-- Tab Navigation -->
                        <ul class="nav nav-pills nav-fill mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">Login</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">Register</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="authTabContent">
                            
                            <!-- LOGIN FORM -->
                            <div class="tab-pane fade show active" id="login-pane" role="tabpanel" aria-labelledby="login-tab">
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label for="loginEmail" class="form-label">Email Address</label>
                                        <input type="email" class="form-control" id="loginEmail" required placeholder="name@example.com">
                                    </div>
                                    <div class="mb-3">
                                        <label for="loginPassword" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••">
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary fw-bold py-2">Sign In</button>
                                    </div>
                                </form>
                            </div>

                            <!-- REGISTER FORM -->
                            <div class="tab-pane fade" id="register-pane" role="tabpanel" aria-labelledby="register-tab">
                                <form id="registerForm">
                                    <div class="mb-3">
                                        <label class="form-label d-block">I am a:</label>
                                        <div class="role-selector">
                                            <button type="button" class="btn btn-outline-secondary role-btn active" data-role="commuter">
                                                <i class="fas fa-user-friends d-block mb-1"></i> Commuter
                                            </button>
                                            <button type="button" class="btn btn-outline-secondary role-btn" data-role="driver">
                                                <i class="fas fa-motorcycle d-block mb-1"></i> Driver
                                            </button>
                                        </div>
                                        <input type="hidden" id="regRole" value="commuter">
                                    </div>

                                    <div class="mb-3">
                                        <label for="regFullName" class="form-label">Full Name</label>
                                        <input type="text" class="form-control" id="regFullName" required placeholder="Juan Dela Cruz">
                                    </div>
                                    <div class="mb-3">
                                        <label for="regPhone" class="form-label">Mobile Number</label>
                                        <input type="tel" class="form-control" id="regPhone" required placeholder="+63 9XX XXX XXXX">
                                    </div>
                                    <div class="mb-3">
                                        <label for="regEmail" class="form-label">Email Address</label>
                                        <input type="email" class="form-control" id="regEmail" required placeholder="name@example.com">
                                    </div>
                                    <div class="mb-3">
                                        <label for="regPassword" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="regPassword" required minlength="8" placeholder="Min 8 characters">
                                    </div>
                                    
                                    <!-- Extra Fields for Drivers -->
                                    <div id="driverFields" class="hidden">
                                        <div class="alert alert-info small py-2 mb-3">
                                            <i class="fas fa-info-circle me-1"></i> Driver accounts require approval by an Admin before activation.
                                        </div>
                                        <div class="mb-3">
                                            <label for="regLicense" class="form-label">Driver's License No.</label>
                                            <input type="text" class="form-control" id="regLicense" placeholder="e.g., ABC-123456">
                                        </div>
                                        <div class="mb-3">
                                            <label for="regPlate" class="form-label">Vehicle Plate Number</label>
                                            <input type="text" class="form-control" id="regPlate" placeholder="e.g., XYZ 1234">
                                        </div>
                                    </div>

                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-success fw-bold py-2">Create Account</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Error/Success Message Container -->
                <div id="authMessage" class="mt-3 text-center"></div>

                <!-- DEBUG OUTPUT BOX -->
                <div id="debugBox" class="hidden">
                    <strong>DEBUG LOG:</strong><br>
                    <span id="debugContent"></span>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        import { supabase } from './assets/js/config.js';

        // --- DEBUGGING HELPER ---
        function logDebug(message, data = null) {
            const box = document.getElementById('debugBox');
            const content = document.getElementById('debugContent');
            
            // Show box if hidden
            box.classList.remove('hidden');
            
            let timestamp = new Date().toLocaleTimeString();
            let logEntry = `[${timestamp}] ${message}\n`;
            
            if (data) {
                try {
                    logEntry += JSON.stringify(data, null, 2) + "\n";
                } catch (e) {
                    logEntry += String(data) + "\n";
                }
            }
            
            content.textContent += logEntry;
            box.scrollTop = box.scrollHeight; // Auto-scroll to bottom
            
            console.log(logEntry); // Also print to browser console
        }

        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const authMessage = document.getElementById('authMessage');
        const roleButtons = document.querySelectorAll('.role-btn');
        const regRoleInput = document.getElementById('regRole');
        const driverFields = document.getElementById('driverFields');

        // --- UI LOGIC ---
        roleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                roleButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const selectedRole = btn.getAttribute('data-role');
                regRoleInput.value = selectedRole;

                if (selectedRole === 'driver') {
                    driverFields.classList.remove('hidden');
                } else {
                    driverFields.classList.add('hidden');
                }
            });
        });

        function showMessage(msg, type = 'danger') {
            authMessage.innerHTML = `<div class="alert alert-${type} py-2 px-3 small">${msg}</div>`;
            setTimeout(() => { authMessage.innerHTML = ''; }, 5000);
        }

        // --- AUTHENTICATION LOGIC WITH DEBUGGING ---

        // 1. LOGIN HANDLER
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            logDebug("--- STARTING LOGIN ATTEMPT ---");
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                logDebug(`Attempting signInWithPassword for: ${email}`);
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    logDebug("❌ SIGN IN ERROR", error);
                    throw error;
                }

                logDebug("✅ SIGN IN SUCCESSFUL", { userId: data.user.id, sessionId: !!data.session });
                showMessage('Login successful! Checking profile...', 'success');
                
                // STEP 2: FETCH PROFILE
                logDebug("Fetching profile from 'profiles' table...");
                
                const { data: profile, error: profileErr } = await supabase
                    .from('profiles')
                    .select('*') // Select ALL fields to see what exists
                    .eq('id', data.user.id)
                    .single(); // Expect exactly one row

                if (profileErr) {
                    logDebug("❌ PROFILE QUERY ERROR", profileErr);
                    // Common errors: 
                    // - PGRST116: no rows returned (ID mismatch or missing record)
                    // - Permission denied (RLS issue)
                    throw new Error(`Database Error: ${profileErr.message}. Code: ${profileErr.code}`);
                }

                if (!profile) {
                    logDebug("❌ NO PROFILE FOUND (Null result)", { searchedId: data.user.id });
                    throw new Error("Profile record does not exist in database.");
                }

                logDebug("✅ PROFILE FOUND", { 
                    id: profile.id, 
                    role: profile.role, 
                    status: profile.status 
                });

                // STEP 3: VALIDATE STATUS & REDIRECT
                if (profile.status !== 'active') {
                    logDebug(`⚠️ ACCOUNT NOT ACTIVE. Status: ${profile.status}`);
                    await supabase.auth.signOut();
                    throw new Error(`Account status is '${profile.status}'. Please contact admin.`);
                }

                logDebug(`🚀 Redirecting to dashboard for role: ${profile.role}`);
                
                if (profile.role === 'admin' || profile.role === 'dispatcher') {
                    window.location.href = 'admin/dashboard.html';
                } else if (profile.role === 'driver') {
                    window.location.href = 'driver/dashboard.html';
                } else {
                    window.location.href = 'commuter/dashboard.html';
                }

            } catch (err) {
                logDebug(`💥 FINAL ERROR CAUGHT: ${err.message}`);
                showMessage(err.message || 'Invalid credentials.', 'danger');
            }
        });

        // 2. REGISTER HANDLER
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            logDebug("--- STARTING REGISTRATION ---");

            const fullName = document.getElementById('regFullName').value;
            const phone = document.getElementById('regPhone').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role = regRoleInput.value;

            try {
                logDebug(`Signing up user: ${email} with role: ${role}`);
                
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: fullName,
                            phone_number: phone,
                            role: role
                        }
                    }
                });

                if (error) {
                    logDebug("❌ SIGN UP ERROR", error);
                    throw error;
                }

                logDebug("✅ SIGN UP SUCCESSFUL", { userId: data.user?.id });
                
                if (data.user && data.session) {
                    showMessage('Registration successful! Logging you in...', 'success');
                    
                    // Wait briefly for trigger to fire if enabled
                    setTimeout(async () => {
                       logDebug("Checking if profile was auto-created by trigger...");
                       const { data: checkProfile } = await supabase.from('profiles').select('*').eq('id', data.user.id).single();
                       
                       if(checkProfile) {
                           logDebug("✅ Trigger worked! Profile exists.", checkProfile);
                           // Proceed to login logic manually or redirect
                           window.location.reload(); 
                       } else {
                           logDebug("⚠️ Trigger FAILED or delayed. Profile missing.", { expectedId: data.user.id });
                           alert("Registered, but profile creation failed. Please contact Admin or try logging in after refreshing.");
                       }
                    }, 2000);

                } else {
                    logDebug("ℹ️ Email confirmation required mode.");
                    showMessage('Check your email to confirm your account.', 'info');
                }

            } catch (err) {
                logDebug(`💥 REGISTRATION ERROR: ${err.message}`);
                showMessage(err.message || 'Registration failed.', 'danger');
            }
        });
    </script>
</body>
</html>
